name: SM-TX Release Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authenticated admin editing and submission storage
        env:
          SM_TX_API_KEY: ${{ secrets.SM_TX_API_KEY }}
        run: node scripts/verify-release.mjs
