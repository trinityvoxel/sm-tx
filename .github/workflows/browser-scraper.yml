name: SM-TX Browser Scraper

on:
  schedule:
    # Tuesday and Friday at 11:43 UTC.
    - cron: '43 11 * * 2,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: browser-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Install Playwright browsers
        working-directory: scripts
        run: npx playwright install chromium --with-deps

      - name: Run browser scraper
        working-directory: scripts
        env:
          SM_TX_EVENTS_PATH: ${{ runner.temp }}/collection-events.json
          SM_TX_REPORT_PATH: ${{ runner.temp }}/collection-health.json
          TZ: America/Chicago
          SM_TX_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && secrets.SM_TX_API_KEY || '' }}
          SM_TX_API_ENDPOINT: https://sm-tx.com/api/admin/import
          SM_TX_JOB_REPORT: https://sm-tx.com/api/admin/jobs/smtx-browser-scraper/runs
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scrape-browser.js --dry-run
          else
            node scrape-browser.js
          fi

      - name: Save collection health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-health
          path: ${{ runner.temp }}/collection-*.json
          retention-days: 7
          if-no-files-found: warn
