name: SM-TX Browser Scraper

on:
  schedule:
    # Every Wednesday at 5:30 AM CST (11:30 UTC)
    - cron: '30 11 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Install Playwright browsers
        working-directory: scripts
        run: npx playwright install chromium --with-deps

      - name: Run browser scraper
        working-directory: scripts
        env:
          SM_TX_API_KEY: ${{ secrets.SM_TX_API_KEY }}
          SM_TX_API_ENDPOINT: https://sm-tx.com/api/admin/import
          SM_TX_JOB_REPORT: https://sm-tx.com/api/admin/jobs/smtx-browser-scraper/runs
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scrape-browser.js --dry-run
          else
            node scrape-browser.js
          fi
