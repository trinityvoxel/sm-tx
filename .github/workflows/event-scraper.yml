name: SM-TX Event Scraper

on:
  schedule:
    # Daily at 11:17 UTC; off the hourly scheduling peak.
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: event-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run event scraper
        env:
          SM_TX_REPORT_PATH: ${{ runner.temp }}/collection-health.json
          TZ: America/Chicago
          SM_TX_API_KEY: ${{ secrets.SM_TX_API_KEY }}
          SM_TX_API_ENDPOINT: https://sm-tx.com/api/admin/import
          SM_TX_JOB_REPORT: https://sm-tx.com/api/admin/jobs/smtx-event-scraper/runs
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/scrape-events.js --dry-run
          else
            node scripts/scrape-events.js
          fi

      - name: Audit published event dates
        if: always() && github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true'
        env:
          SM_TX_DATE_AUDIT_PATH: ${{ runner.temp }}/date-audit.json
        run: node scripts/audit-live-dates.mjs

      - name: Save date audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-audit
          path: ${{ runner.temp }}/date-audit.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Save collection health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-health
          path: ${{ runner.temp }}/collection-health.json
          retention-days: 7
          if-no-files-found: warn
