name: SM-TX Event Scraper

on:
  schedule:
    # Every Wednesday at 5:00 AM CST (11:00 UTC)
    - cron: '0 11 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run event scraper
        env:
          SM_TX_API_KEY: ${{ secrets.SM_TX_API_KEY }}
          SM_TX_API_ENDPOINT: https://sm-tx.com/api/admin/import
          SM_TX_JOB_REPORT: https://sm-tx.com/api/admin/jobs/smtx-event-scraper/runs
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/scrape-events.js --dry-run
          else
            node scripts/scrape-events.js
          fi
