name = "sm-tx"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "sm-tx-events"
database_id = "3c83f9e8-f37c-4d76-9548-a085f7892ade"

# AI-generated event images are disabled. Events without scraped/source images
# should use the frontend poster-card fallback instead of queueing generation.

# Secrets (set via wrangler pages secret put --project-name sm-tx):
# API_KEY — admin API key
# FAL_API_KEY — fal.ai image generation
# ADMIN_PASSWORD — dashboard login
# TELEGRAM_BOT_TOKEN — Telegram notifications
# TELEGRAM_CHAT_ID — Telegram chat ID
# GITHUB_TOKEN — GitHub Actions trigger
# GITHUB_REPO — e.g. "trinityvoxel/sm-tx"
