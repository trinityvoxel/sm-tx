name = "sm-tx"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "sm-tx-events"
database_id = "3c83f9e8-f37c-4d76-9548-a085f7892ade"

[[queues.producers]]
queue = "sm-tx-image-gen"
binding = "IMAGE_QUEUE"

# Note: R2 bucket (sm-tx-images) is bound in the standalone sm-tx-image-worker,
# not here. The Pages Function only produces to the queue; the Worker does R2 I/O.
# To add R2 binding here if needed, first enable R2 in the Cloudflare Dashboard.

# Secrets (set via wrangler pages secret put --project-name sm-tx):
# API_KEY — admin API key
# FAL_API_KEY — fal.ai image generation
# ADMIN_PASSWORD — dashboard login
# TELEGRAM_BOT_TOKEN — Telegram notifications
# TELEGRAM_CHAT_ID — Telegram chat ID
# GITHUB_TOKEN — GitHub Actions trigger
# GITHUB_REPO — e.g. "trinityvoxel/sm-tx"
